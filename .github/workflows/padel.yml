name: Padel check

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, 06:00-21:30 UTC (covers 08:00-22:00 Vienna in summer)
    - cron: "0,30 6-21 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python padel_check.py

      - name: Save state
        run: |
          git config user.name "padel-bot"
          git config user.email "padel-bot@users.noreply.github.com"
          git add slots_state.json
          git diff --cached --quiet || (git commit -m "Update slot state" && git push)
