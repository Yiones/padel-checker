name: Padel check

on:
  workflow_dispatch:          # manual trigger only, for now

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python padel_check.py

      - name: Save seen slots
        run: |
          git config user.name "padel-bot"
          git config user.email "padel-bot@users.noreply.github.com"
          git add seen_slots.json
          git diff --cached --quiet || (git commit -m "Update seen slots" && git push)
